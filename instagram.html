<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Instagram</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Allura&family=Cormorant+Garamond:wght@400;500&family=Noto+Serif+JP:wght@300&display=swap" rel="stylesheet">
<style>
@font-face{font-family:"Amsterdam";
  src:local("Amsterdam"),url("fonts/Amsterdam.woff2") format("woff2"),url("fonts/Amsterdam.otf") format("opentype"),url("fonts/Amsterdam.ttf") format("truetype");
  font-display:swap}
:root{--ink:#1c2b48;--line:#c6d9ea;--tile:#b9c9d9;--select:#e8ecef;--script:"Amsterdam","Allura",cursive}
*{box-sizing:border-box}
html,body{margin:0}
body{background:#fff;color:var(--ink);font-family:"Cormorant Garamond","Noto Serif JP","Source Han Serif JP","源ノ明朝",serif;font-weight:400;line-height:1.6}
button{font:inherit;color:inherit;background:none;border:0;padding:0;cursor:pointer}
.page{max-width:560px;margin:0 auto;padding:22px 5% 80px}
.brand{display:inline-block;font-family:var(--script);font-weight:400;font-size:clamp(1.25rem,5.4vw,1.8rem);line-height:1.2;text-decoration:none;color:inherit}

/* タブ(下の線がすべるように動く) */
.tabs{position:relative;display:flex;margin:14px 0 26px;border-bottom:1px solid var(--line)}
.tabs button{flex:1;padding:8px 0 10px;font-size:1.05rem;letter-spacing:.04em;opacity:.55;transition:opacity .4s}
.tabs button.on{opacity:1}
.ind{position:absolute;left:0;bottom:-1px;height:2px;width:0;background:var(--ink);transition:transform .55s cubic-bezier(.2,.8,.2,1),width .55s cubic-bezier(.2,.8,.2,1)}
@keyframes bloom{from{opacity:0;transform:translateY(12px);filter:blur(5px)}to{opacity:1;transform:none;filter:blur(0)}}
.panel[hidden]{display:none}
.panel.in{animation:bloom .7s cubic-bezier(.2,.8,.2,1) both}

/* Storys: 中央の線に沿って、左右に交互に並べる */
.sh{margin:6px 0 22px;text-align:center;font-weight:400;font-size:1.5rem;letter-spacing:.08em}
.tl{position:relative}
.tl::before{content:"";position:absolute;left:50%;top:0;bottom:0;width:1px;background:var(--line)}
.day{position:relative;display:grid;grid-template-columns:1fr 1fr;align-items:center;margin-bottom:22px}
.day::after{content:"";position:absolute;left:50%;top:50%;width:7px;height:7px;margin:-3.5px 0 0 -3.5px;border-radius:50%;background:var(--ink)}
.day .dt,.day .th{grid-row:1}
.day .dt{font-size:1.15rem;padding:0 16px}
.day.l .th{grid-column:1;justify-self:end;margin-right:16px}
.day.l .dt{grid-column:2}
.day.r .dt{grid-column:1;text-align:right}
.day.r .th{grid-column:2;justify-self:start;margin-left:16px}
.th{position:relative;width:min(27vw,120px);aspect-ratio:9/16;background:var(--tile);overflow:hidden;cursor:pointer}
.th img,.th video,.tile img,.tile video{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;display:block}
.th>*{animation:fade .45s ease both}
@keyframes fade{from{opacity:0}to{opacity:1}}
.pb{position:absolute;inset:0;margin:auto;width:26px;height:26px;border-radius:50%;background:var(--ink);pointer-events:none}
.pb::after{content:"";position:absolute;left:10px;top:7px;border-left:9px solid #fff;border-top:6px solid transparent;border-bottom:6px solid transparent}
.cnt{position:absolute;right:5px;bottom:4px;font-size:.78rem;color:#fff;text-shadow:0 1px 5px rgba(28,43,72,.6);pointer-events:none}

/* アーカイブ: 月ごとに開く */
.arc{margin-top:34px}
.bar{position:relative;display:block;width:100%;height:38px;margin-bottom:8px;background:var(--ink);color:#fff;font-size:1.05rem;letter-spacing:.06em}
.bar svg{position:absolute;right:12px;top:50%;width:16px;height:16px;margin-top:-8px;fill:none;stroke:#fff;stroke-width:1.5;stroke-linecap:round;stroke-linejoin:round}
.fold{display:grid;grid-template-rows:0fr;transition:grid-template-rows .6s cubic-bezier(.2,.8,.2,1)}
.fold.open{grid-template-rows:1fr}
.fold>div{overflow:hidden}
.fold .tl{padding:20px 0 6px}

/* Feeds / Reels: 横3マス */
.grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:3px}
.tile{position:relative;aspect-ratio:4/5;background:var(--tile);overflow:hidden;cursor:pointer}
.reels .tile{aspect-ratio:9/16}
.tile .d{position:absolute;left:0;right:0;bottom:6px;text-align:center;font-size:.95rem;color:#fff;text-shadow:0 1px 6px rgba(28,43,72,.55)}
.none{text-align:center;opacity:.6;padding:30px 0}

/* 拡大表示(うしろが透ける背景) */
.ov{position:fixed;inset:0;z-index:20;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:12px;padding:6%;
  background:rgba(232,236,239,.74);-webkit-backdrop-filter:blur(18px) saturate(1.1);backdrop-filter:blur(18px) saturate(1.1);
  opacity:0;visibility:hidden;transition:opacity .45s ease,visibility 0s .45s}
.ov.show{opacity:1;visibility:visible;transition:opacity .45s ease}
.ov .m{max-width:100%;max-height:78vh;opacity:0;transform:translateY(14px) scale(.98);transition:transform .65s cubic-bezier(.2,.8,.2,1),opacity .6s ease;background:var(--tile)}
.ov.show .m{opacity:1;transform:none}
.ov a{font-size:.9rem;color:var(--ink)}
@media (prefers-reduced-motion:reduce){.panel.in,.th>*{animation:none}}
</style>
</head>
<body>
<div class="page">
  <a class="brand" id="brand" href="#" target="_blank" rel="noopener noreferrer">Instagram</a>
  <nav class="tabs" id="tabs">
    <button data-t="stories" class="on">Storys</button><button data-t="feeds">Feeds</button><button data-t="reels">Reels</button>
    <span class="ind" id="ind"></span>
  </nav>
  <section class="panel" id="p-stories"></section>
  <section class="panel" id="p-feeds" hidden></section>
  <section class="panel" id="p-reels" hidden></section>
</div>
<div class="ov" id="ov"></div>
<script src="instagram-data.js"></script>
<script>
(function () {
  if (typeof instagramData === 'undefined') { document.getElementById('p-stories').textContent = 'instagram-data.js を読み込めませんでした。書き方を確認してください。'; return; }
  document.getElementById('brand').href = instagramAccount;
  const pad = n => String(n).padStart(2, '0');
  const parts = d => d.split('/').map(Number);
  const key = d => parts(d).reduce((a, n) => a * 100 + n, 0);
  const desc = (a, b) => key(b.date) - key(a.date);
  const dl = d => { const p = parts(d); return pad(p[1]) + '.' + pad(p[2]); };      // 10.09
  const ml = d => { const p = parts(d); return p[0] + '.' + pad(p[1]); };           // 2026.10

  const media = (m, full) => {
    if (!m.src) return m.type === 'video' && !full ? '<span class="pb"></span>' : '<div></div>';
    return m.type === 'video'
      ? `<video src="${m.src}${full ? '' : '#t=0.1'}" muted playsinline preload="metadata" ${full ? 'controls autoplay' : ''}></video>${full ? '' : '<span class="pb"></span>'}`
      : `<img src="${m.src}" alt="" loading="lazy">`;
  };

  // ----- Storys(タイムライン) -----
  function timeline(days) {
    const tl = document.createElement('div'); tl.className = 'tl';
    days.forEach((day, i) => {
      const row = document.createElement('div'); row.className = 'day ' + (i % 2 ? 'r' : 'l');
      const n = day.media.length; let idx = 0;
      row.innerHTML = '<div class="th"></div><div class="dt">' + dl(day.date) + '</div>';
      const th = row.querySelector('.th');
      const draw = () => { th.innerHTML = media(day.media[idx]) + (n > 1 ? `<span class="cnt">${idx + 1}/${n}</span>` : ''); };
      draw();
      th.addEventListener('click', () => {
        if (n > 1) { idx = (idx + 1) % n; draw(); }                       // 同じ日に複数あるときは、タップで切りかわる
        else { const v = th.querySelector('video'); if (v) { v.paused ? v.play() : v.pause(); } }
      });
      tl.appendChild(row);
    });
    return tl;
  }
  const stories = [...instagramData.stories].sort(desc);
  const ps = document.getElementById('p-stories');
  if (!stories.length) ps.innerHTML = '<p class="none">まだありません</p>';
  else {
    const cur = ml(stories[0].date);
    ps.innerHTML = `<h2 class="sh">STORY // ${cur}</h2>`;
    ps.appendChild(timeline(stories.filter(s => ml(s.date) === cur)));
    const months = [...new Set(stories.map(s => ml(s.date)))].filter(m => m !== cur);
    const arc = document.createElement('div'); arc.className = 'arc';
    months.forEach(m => {
      const bar = document.createElement('button'); bar.className = 'bar';
      const fold = document.createElement('div'); fold.className = 'fold';
      const inner = document.createElement('div'); fold.appendChild(inner);
      let built = false;
      const label = () => `${m} [${fold.classList.contains('open') ? '−' : '+'}]`;
      bar.innerHTML = label() + '<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M9 11V5a1.5 1.5 0 0 1 3 0v5l5 1a2 2 0 0 1 1.6 2L17.5 19H10l-3-5 2-1z"/></svg>';
      bar.addEventListener('click', () => {
        if (!built) { inner.appendChild(timeline(stories.filter(s => ml(s.date) === m))); built = true; }
        fold.classList.toggle('open');
        bar.firstChild.textContent = label();
      });
      arc.append(bar, fold);
    });
    ps.appendChild(arc);
  }

  // ----- Feeds / Reels(横3マス) + 拡大表示 -----
  const ov = document.getElementById('ov');
  const closeOv = () => { ov.classList.remove('show'); setTimeout(() => { ov.innerHTML = ''; }, 500); };
  ov.addEventListener('click', (e) => { if (e.target.tagName !== 'A' && e.target.tagName !== 'VIDEO') closeOv(); });
  function grid(id, items, cls) {
    const p = document.getElementById(id);
    if (!items.length) { p.innerHTML = '<p class="none">まだありません</p>'; return; }
    const g = document.createElement('div'); g.className = 'grid ' + cls;
    [...items].sort(desc).forEach(it => {
      const t = document.createElement('div'); t.className = 'tile';
      t.innerHTML = media(it) + `<span class="d">${dl(it.date)}</span>`;
      t.addEventListener('click', () => {
        if (!it.src) return;
        ov.innerHTML = '<div class="m">' + media(it, true) + '</div>' + (it.url ? `<a href="${it.url}" target="_blank" rel="noopener noreferrer">Instagram ↗</a>` : '');
        const el = ov.querySelector('.m'); const c = el.firstElementChild; if (c) { c.classList.add('m'); el.replaceWith(c); }
        ov.classList.add('show');
      });
      g.appendChild(t);
    });
    p.appendChild(g);
  }
  grid('p-feeds', instagramData.feeds || [], 'feeds');
  grid('p-reels', instagramData.reels || [], 'reels');

  // ----- タブ -----
  const tabs = [...document.querySelectorAll('#tabs button')], ind = document.getElementById('ind');
  const move = (b) => { ind.style.width = b.offsetWidth + 'px'; ind.style.transform = `translateX(${b.offsetLeft}px)`; };
  function show(b) {
    tabs.forEach(x => x.classList.toggle('on', x === b));
    move(b);
    ['stories', 'feeds', 'reels'].forEach(t => {
      const p = document.getElementById('p-' + t);
      const on = t === b.dataset.t;
      p.hidden = !on; p.classList.remove('in');
      if (on) { void p.offsetWidth; p.classList.add('in'); }
    });
  }
  tabs.forEach(b => b.addEventListener('click', () => show(b)));
  window.addEventListener('resize', () => move(tabs.find(x => x.classList.contains('on'))));
  if (document.fonts && document.fonts.ready) document.fonts.ready.then(() => move(tabs.find(x => x.classList.contains('on'))));
  move(tabs[0]);
})();
</script>
</body>
</html>
