<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>YouTube</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Allura&family=Cormorant+Garamond:wght@400;500&family=Noto+Serif+JP:wght@300&display=swap" rel="stylesheet">
<style>
@font-face{
  font-family:"Amsterdam";
  src:local("Amsterdam"),url("fonts/Amsterdam.woff2") format("woff2"),
      url("fonts/Amsterdam.otf") format("opentype"),url("fonts/Amsterdam.ttf") format("truetype");
  font-display:swap}
:root{--ink:#1c2b48;--soft:#8fb8dd;--select:#e8ecef;--script:"Amsterdam","Allura",cursive}
*{box-sizing:border-box}
html,body{margin:0}
body{background:#fff;color:var(--ink);font-family:"Cormorant Garamond","Noto Serif JP","Source Han Serif JP","源ノ明朝",serif;font-weight:300;line-height:1.7}
a{color:inherit;text-decoration:none}
.page{max-width:760px;margin:0 auto;padding:22px 7% 80px}
.brand{display:inline-block;font-family:var(--script);font-weight:400;font-size:clamp(1.7rem,5.5vw,2.2rem);line-height:1.1;margin-bottom:clamp(24px,6vw,44px)}
.item{display:flex;align-items:flex-start;gap:5%;margin:0 0 clamp(30px,8vw,56px)}
.thumb{position:relative;flex:none;width:42%;aspect-ratio:16/9;background:var(--select);overflow:hidden;display:block}
a.thumb{cursor:pointer}
.thumb img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;border:0}
.thumb .play{position:absolute;inset:0;margin:auto;width:34px;height:34px;fill:none;stroke:#fff;stroke-width:1.5;stroke-linejoin:round;filter:drop-shadow(0 1px 4px rgba(28,43,72,.5))}
.info{flex:1;min-width:0}
.day{font-size:clamp(.85rem,2.6vw,1rem)}
.title{margin:0;font-weight:300;font-size:clamp(1.05rem,4.2vw,1.5rem);line-height:1.5}
.comment{margin:4px 0 0;color:var(--soft);font-size:clamp(.78rem,2.4vw,.9rem);white-space:pre-line;
  display:-webkit-box;-webkit-box-orient:vertical;-webkit-line-clamp:4;overflow:hidden}
</style>
</head>
<body>
<div class="page">
  <a class="brand" id="brand" href="#" target="_blank" rel="noopener noreferrer">YouTube</a>
  <div id="list"></div>
</div>
<script src="youtube-data.js"></script>
<script>
(function () {
  if (typeof youtubeData === 'undefined') {
    document.getElementById('list').textContent = 'youtube-data.js を読み込めませんでした。書き方を確認してください。';
    return;
  }
  document.getElementById('brand').href = youtubeChannel;
  const ytId = (url) => { const m = (url || '').match(/(?:v=|youtu\.be\/|shorts\/|embed\/)([\w-]{11})/); return m ? m[1] : ''; };
  const esc = (s) => String(s == null ? '' : s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
  const day = (d) => d.split('/').map(n => parseInt(n, 10)).join('.');   // 2026/10/03 → 2026.10.3

  const list = document.getElementById('list');
  youtubeData.forEach(v => {
    const id = ytId(v.url);
    const row = document.createElement('div');
    row.className = 'item';
    // サムネイルを押すと、YouTube のアプリ(入っていれば)またはサイトで動画が開く
    const tag = id ? 'a' : 'div';
    const attr = id ? ` href="https://www.youtube.com/watch?v=${id}" target="_blank" rel="noopener noreferrer"` : '';
    row.innerHTML = `
      <${tag} class="thumb"${attr} aria-label="YouTubeで動画を見る">
        ${id ? `<img alt="" loading="lazy" src="https://i.ytimg.com/vi/${id}/maxresdefault.jpg">` : ''}
        <svg class="play" viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="10.5"/><path d="M10 8.5l5.5 3.5-5.5 3.5z"/></svg>
      </${tag}>
      <div class="info">
        <div class="day">${esc(day(v.date))}</div>
        <h2 class="title">${esc(v.title)}</h2>
        <p class="comment">${esc(v.comment)}</p>
      </div>`;
    const img = row.querySelector('img');   // 高画質がない動画は、ふつうの画質に切りかえる
    if (img) img.addEventListener('error', () => { img.src = `https://i.ytimg.com/vi/${id}/hqdefault.jpg`; }, { once: true });
    list.appendChild(row);
  });
})();
</script>
</body>
</html>
