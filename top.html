<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>NAKAJIMA KENTO</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Allura&family=Cormorant+Garamond:wght@500;600&family=Noto+Serif+JP:wght@300&display=swap" rel="stylesheet">
<style>
/* 筆記体: Amsterdam。フォントファイルを fonts フォルダに置くと使われる(なければ Allura) */
@font-face{
  font-family:"Amsterdam";
  src:local("Amsterdam"),
      url("fonts/Amsterdam.woff2") format("woff2"),
      url("fonts/Amsterdam.otf") format("opentype"),
      url("fonts/Amsterdam.ttf") format("truetype");
  font-display:swap;
}
:root{
  --script:"Amsterdam","Allura",cursive;
  --serif-en:"Cormorant Garamond",serif;
  --serif-ja:"Noto Serif JP","Source Han Serif JP","源ノ明朝","Hiragino Mincho ProN","Yu Mincho",serif;
  --navy:#1d2b4b;
  --mist:#c6d9ea;
  --pill:#c3d3e3;
  --sky1:#d6eafb;
  --sky2:#9fcff4;
  --white:#fff;
}
*{box-sizing:border-box}
html,body{margin:0}
body{
  background:var(--white);
  color:var(--navy);
  font-family:var(--serif-ja);
  font-weight:300;
  line-height:1.8;
}
a{color:inherit;text-decoration:none}
a:focus-visible{outline:2px solid var(--navy);outline-offset:4px}
.page{max-width:720px;margin:0 auto}

/* 上部: profile リンク */
.top{display:flex;justify-content:flex-end;padding:22px 28px 14px}
.top a{font-family:var(--serif-en);font-weight:600;font-size:1.25rem;letter-spacing:.02em}

/* ヒーロー: 写真は images/hero.jpg に置く(なければ空色のまま) */
.hero{
  position:relative;
  aspect-ratio:1080/610;
  background:url("images/hero.jpg") center 28%/cover no-repeat,
             linear-gradient(160deg,var(--sky1),var(--sky2));
}
.hero::after{
  content:"";position:absolute;left:0;right:0;bottom:0;height:22%;
  background:linear-gradient(to bottom,rgba(255,255,255,0),rgba(255,255,255,.9));
}
.hero h1{
  position:absolute;z-index:1;left:2%;bottom:-.1em;margin:0;
  font-family:var(--serif-en);font-weight:600;
  font-size:clamp(2rem,10.4vw,4.6rem);line-height:1;letter-spacing:.01em;
  color:var(--white);white-space:nowrap;
  text-shadow:0 2px 14px rgba(70,120,170,.35);
}

/* News */
.news{padding:44px 14% 0}
.news h2{
  margin:0 0 6px;font-family:var(--script);font-weight:400;
  font-size:3.2rem;line-height:1;
}
.news ul{list-style:none;margin:0;padding:0}
.news li{display:flex;align-items:center;gap:12px;margin-top:8px}
.news time{
  flex:none;background:var(--pill);border-radius:6px;
  padding:2px 14px;font-family:var(--serif-en);font-weight:600;
  font-size:1.15rem;
}
.news .text{
  flex:1;border-bottom:2px solid var(--mist);
  padding:0 0 2px 6%;font-size:.95rem;
}

/* 6つのリンク */
.links{
  display:grid;grid-template-columns:repeat(3,1fr);
  gap:32px 8%;padding:56px 12% 90px;
}
.tile{display:block;text-align:center}
.box{position:relative;aspect-ratio:1;border-top:2px solid var(--mist);border-right:2px solid var(--mist)}
.box::before{ /* 左の線(下は斜めに切れる) */
  content:"";position:absolute;left:0;top:0;height:68%;
  border-left:2px solid var(--mist)}
.box::after{ /* 下の線(左は斜めに切れる) */
  content:"";position:absolute;right:0;bottom:0;width:62%;
  border-bottom:2px solid var(--mist)}
.cut{
  position:absolute;left:-7%;top:68%;width:46%;height:2px;
  background:var(--mist);transform:rotate(45deg);transform-origin:left center}
.box svg{
  position:absolute;inset:0;margin:auto;width:36%;height:36%;
  fill:none;stroke:var(--navy);stroke-width:1.5;
  stroke-linecap:round;stroke-linejoin:round}
.label{
  display:block;margin-top:10px;font-family:var(--script);font-weight:400;
  font-size:1.7rem;line-height:1.1}
.tile:hover .box,.tile:hover .box::before,.tile:hover .box::after{border-color:var(--navy)}
.tile:hover .cut{background:var(--navy)}
</style>
</head>
<body>
<div class="page">

  <nav class="top"><a href="#">profile</a></nav>

  <header class="hero" role="img" aria-label="中島健人">
    <h1>NAKAJIMA KENTO</h1>
  </header>

  <!-- ニュース: 1行ぶんが <li>…</li>。増やすときは行ごとコピーして書き換える -->
  <section class="news">
    <h2>News</h2>
    <ul>
      <li><time>yy/mm/dd</time><span class="text">「番組名」　出演</span></li>
      <li><time>yy/mm/dd</time><span class="text">「雑誌名」　掲載</span></li>
      <li><time>yy/mm/dd</time><span class="text">YouTube更新</span></li>
    </ul>
  </section>

  <!-- リンク: href="#" の「#」を、行き先のURLに書き換える -->
  <nav class="links" aria-label="リンク">
    <a class="tile" href="index.html">
      <span class="box"><span class="cut"></span>
        <svg viewBox="0 0 24 24" aria-hidden="true"><rect x="3" y="8" width="18" height="12" rx="1.5"/><circle cx="8" cy="14" r="2.2"/><path d="M13 12.5h5M13 15.5h5M15 8l4-4"/></svg>
      </span><span class="label">radio</span>
    </a>
    <a class="tile" href="#">
      <span class="box"><span class="cut"></span>
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 7c-2-1.5-5-1.8-8-1v12c3-.8 6-.5 8 1 2-1.5 5-1.8 8-1V6c-3-.8-6-.5-8 1zM12 7v12"/></svg>
      </span><span class="label">blog</span>
    </a>
    <a class="tile" href="#">
      <span class="box"><span class="cut"></span>
        <svg viewBox="0 0 24 24" aria-hidden="true"><rect x="4" y="5" width="16" height="14" rx="1.5"/><path d="M10 9l6 3-6 3z"/></svg>
      </span><span class="label">youtube</span>
    </a>
    <a class="tile" href="#">
      <span class="box"><span class="cut"></span>
        <svg viewBox="0 0 24 24" aria-hidden="true"><rect x="4" y="4" width="16" height="16" rx="4.5"/><circle cx="12" cy="12" r="3.6"/><circle cx="17" cy="7" r=".6"/></svg>
      </span><span class="label">Instagram</span>
    </a>
    <a class="tile" href="#">
      <span class="box"><span class="cut"></span>
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 4h4.5l11.5 16h-4.5zM19.5 4l-6.5 7.2M4.5 20l6.5-7.2"/></svg>
      </span><span class="label">x</span>
    </a>
    <a class="tile" href="#">
      <span class="box"><span class="cut"></span>
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M9 18V6l9-2v12"/><circle cx="6.5" cy="18" r="2.5"/><circle cx="15.5" cy="16" r="2.5"/></svg>
      </span><span class="label">tiktok</span>
    </a>
  </nav>

</div>
</body>
</html>
