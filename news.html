<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>News</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Allura&family=Cormorant+Garamond:wght@400;500;600&family=Noto+Serif+JP:wght@300&display=swap" rel="stylesheet">
<style>
@font-face{font-family:"Amsterdam";
  src:local("Amsterdam"),url("fonts/Amsterdam.woff2") format("woff2"),url("fonts/Amsterdam.otf") format("opentype"),url("fonts/Amsterdam.ttf") format("truetype");
  font-display:swap}
:root{--ink:#1c2b48;--line:#c6d9ea;--pill:#c3d3e3;--script:"Amsterdam","Allura",cursive}
*{box-sizing:border-box}
html,body{margin:0}
body{background:#fff;color:var(--ink);font-family:"Cormorant Garamond","Noto Serif JP","Source Han Serif JP","源ノ明朝",serif;font-weight:300;line-height:1.8}
a{color:inherit;text-decoration:none}
.page{max-width:720px;margin:0 auto;padding:22px 7% 80px}
.brand,.brand:link,.brand:visited,.brand:hover{display:inline-block;font-family:var(--script);font-weight:400;font-size:clamp(1.7rem,6.5vw,2.4rem);line-height:1.2;margin-bottom:clamp(20px,5vw,34px);color:var(--ink)!important;text-decoration:none!important}
@keyframes bloom{from{opacity:0;transform:translateY(12px);filter:blur(5px)}to{opacity:1;transform:none;filter:blur(0)}}
.list{list-style:none;margin:0;padding:0}
.list li{padding:16px 0 18px;border-bottom:1px solid var(--line);animation:bloom .9s cubic-bezier(.2,.8,.2,1) both}
.meta{display:flex;align-items:center;gap:12px;margin-bottom:6px}
.meta time{background:var(--pill);border-radius:6px;padding:1px 12px;font-weight:600;font-size:1.05rem}
.cat{border-top:1px solid var(--ink);border-bottom:1px solid var(--ink);padding:0 8px;font-size:.8rem;font-weight:600;letter-spacing:.06em;line-height:1.5}
.ttl{font-size:clamp(.92rem,3.6vw,1.05rem);line-height:1.8;overflow-wrap:anywhere}
.ttl a:hover{opacity:.65}
.back{display:block;margin:28px 0 0 auto;width:fit-content;font-size:1.05rem;letter-spacing:.06em}
.none{opacity:.6;text-align:center;padding:30px 0}
@media (prefers-reduced-motion:reduce){.list li{animation:none}}
</style>
</head>
<body>
<div class="page">
  <a class="brand" href="top.html">News</a>
  <ul class="list" id="list"></ul>
  <a class="back" href="top.html">← Top</a>
</div>
<script src="news-data.js"></script>
<script>
(function () {
  const list = document.getElementById('list');
  if (typeof newsData === 'undefined') { list.innerHTML = '<li class="none">news-data.js を読み込めませんでした。書き方を確認してください。</li>'; return; }
  const esc = (s) => String(s == null ? '' : s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
  const key = (d) => d.split('/').map(Number).reduce((a, n) => a * 100 + n, 0);
  const dot = (d) => { const p = d.split('/'); return p[0] + '.' + p[1].padStart(2, '0') + '.' + p[2].padStart(2, '0'); };   // 2026.10.19
  const items = [...newsData].sort((a, b) => key(b.date) - key(a.date));
  if (!items.length) { list.innerHTML = '<li class="none">まだありません</li>'; return; }
  list.innerHTML = items.map((n, i) => {
    const title = n.url ? `<a href="${esc(n.url)}" target="_blank" rel="noopener noreferrer">${esc(n.title)}</a>` : esc(n.title);
    return `<li style="animation-delay:${Math.min(i, 12) * 0.06}s"><div class="meta"><time>${dot(n.date)}</time>${n.category ? `<span class="cat">${esc(n.category)}</span>` : ''}</div><div class="ttl">${title}</div></li>`;
  }).join('');
})();
</script>
</body>
</html>
