name: update youtube data

on:
  schedule:
    - cron: '17 */3 * * *'     # 3時間おき
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: 新しい動画を探して、youtube-data.js に足す
        run: node scripts/update-youtube.mjs
      - name: 変わっていたら保存する
        run: |
          git config user.name "github-actions"
          git config user.email "github-actions@users.noreply.github.com"
          git add youtube-data.js
          git diff --cached --quiet || (git commit -m "Update youtube-data.js" && git push)
